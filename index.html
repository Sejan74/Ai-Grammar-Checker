<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Grammar Checker v2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; background: #070912; }
    .glass {
      background: linear-gradient(145deg, rgba(255,255,255,.07), rgba(255,255,255,.025));
      border: 1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 20px 60px -20px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.08);
    }
    .glass-input {
      background: rgba(8,10,20,.55);
      border: 1px solid rgba(255,255,255,.10);
      transition: border-color .2s, box-shadow .2s;
    }
    .glass-input:focus { outline: none; border-color: rgba(129,140,248,.7); box-shadow: 0 0 0 4px rgba(99,102,241,.18); }
    .glow-btn {
      background: linear-gradient(135deg, #6366f1, #8b5cf6 55%, #d946ef);
      box-shadow: 0 0 24px rgba(139,92,246,.45), 0 0 60px rgba(99,102,241,.25);
      transition: transform .15s, box-shadow .25s, filter .2s;
    }
    .glow-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 0 34px rgba(167,139,250,.65), 0 0 80px rgba(99,102,241,.35); filter: brightness(1.08); }
    .glow-btn:active:not(:disabled) { transform: translateY(0); }
    .glow-btn:disabled { opacity: .7; cursor: not-allowed; }
    .orb { position: fixed; border-radius: 9999px; filter: blur(90px); pointer-events: none; z-index: -1; }
    .shimmer {
      background: linear-gradient(90deg, rgba(255,255,255,.04) 25%, rgba(255,255,255,.11) 50%, rgba(255,255,255,.04) 75%);
      background-size: 200% 100%; animation: shimmer 1.4s infinite linear;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .fade-up { animation: fadeUp .45s ease-out both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    select option { background: #12162a; color: #e2e8f0; }
    ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 8px; }
  </style>
</head>
<body class="min-h-screen text-slate-200 antialiased">
  <div class="orb -top-32 -left-24 h-[28rem] w-[28rem] bg-indigo-600/30"></div>
  <div class="orb top-1/3 -right-32 h-[26rem] w-[26rem] bg-fuchsia-600/20"></div>
  <div class="orb -bottom-40 left-1/3 h-[24rem] w-[24rem] bg-cyan-500/15"></div>

  <main class="mx-auto max-w-3xl px-4 py-12 sm:py-20">
    <!-- Hero -->
    <header class="mb-10 text-center">
      <span class="glass inline-flex items-center gap-2 rounded-full px-4 py-1.5 text-xs font-semibold tracking-wide text-indigo-200">
        <span class="relative flex h-2 w-2">
          <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-70"></span>
          <span class="relative inline-flex h-2 w-2 rounded-full bg-emerald-400"></span>
        </span>
        AI Grammar Checker v2.0
      </span>
      <h1 class="mt-6 text-4xl font-extrabold tracking-tight text-white sm:text-6xl">
        Write with
        <span class="bg-gradient-to-r from-indigo-300 via-violet-300 to-fuchsia-300 bg-clip-text text-transparent">confidence</span>
      </h1>
      <p class="mx-auto mt-4 max-w-xl text-sm text-slate-400 sm:text-base">
        Paste your draft, choose a tone, and get instant grammar corrections that keep your voice intact.
      </p>
    </header>

    <!-- Input -->
    <form id="form" class="glass rounded-3xl p-5 sm:p-7">
      <div class="mb-2 flex items-center justify-between">
        <label for="text" class="text-sm font-medium text-slate-300">Your text</label>
        <span id="counter" class="text-xs tabular-nums text-slate-500">0 characters · 0 words</span>
      </div>
      <textarea id="text" rows="8" required placeholder="Type or paste your text here…"
        class="glass-input w-full resize-y rounded-2xl px-4 py-3.5 text-[15px] leading-relaxed text-slate-100 placeholder-slate-500"></textarea>

      <div class="mt-5 flex flex-col gap-4 sm:flex-row sm:items-end">
        <div class="sm:w-64">
          <label for="tone" class="mb-2 block text-sm font-medium text-slate-300">Tone</label>
          <div class="relative">
            <select id="tone" class="glass-input w-full appearance-none rounded-xl px-4 py-3 pr-10 text-sm text-slate-100">
              <option>Clear &amp; Natural</option>
              <option>Professional</option>
              <option>Academic</option>
              <option>Creative</option>
            </select>
            <svg class="pointer-events-none absolute right-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></svg>
          </div>
        </div>

        <button id="submit" type="submit" class="glow-btn inline-flex flex-1 items-center justify-center gap-2.5 rounded-xl px-6 py-3 text-sm font-semibold text-white">
          <svg id="spinner" class="hidden h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" class="opacity-25"/>
            <path fill="currentColor" d="M4 12a8 8 0 0 1 8-8v4a4 4 0 0 0-4 4H4z" class="opacity-90"/>
          </svg>
          <svg id="sparkle" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.8 4.2 11 8l3.8 1.2L11 10.4 9.8 14.2 8.6 10.4 4.8 9.2 8.6 8 9.8 4.2ZM17 13l.7 2.3L20 16l-2.3.7L17 19l-.7-2.3L14 16l2.3-.7L17 13Z"/></svg>
          <span id="btnLabel">Check Grammar</span>
        </button>
      </div>
      <p class="mt-4 text-xs text-slate-500">Tip: press <kbd class="rounded bg-white/10 px-1.5 py-0.5 text-slate-300">Ctrl</kbd> + <kbd class="rounded bg-white/10 px-1.5 py-0.5 text-slate-300">Enter</kbd> to submit.</p>
    </form>

    <!-- Output -->
    <section id="result" class="glass mt-6 hidden rounded-3xl p-5 sm:p-7" aria-live="polite">
      <div class="mb-4 flex items-center justify-between gap-3">
        <h2 class="flex items-center gap-2 text-sm font-semibold uppercase tracking-wider text-slate-400">
          <span class="h-2 w-2 rounded-full bg-violet-400 shadow-[0_0_10px_rgba(167,139,250,.9)]"></span>
          Corrections
        </h2>
        <button id="copy" type="button"
          class="hidden items-center gap-1.5 rounded-lg border border-white/10 bg-white/5 px-3 py-1.5 text-xs font-medium text-slate-200 transition hover:border-violet-400/60 hover:bg-white/10">
          <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
          <span id="copyLabel">Copy Text</span>
        </button>
      </div>

      <div id="skeleton" class="hidden space-y-3">
        <div class="shimmer h-4 w-11/12 rounded"></div>
        <div class="shimmer h-4 w-full rounded"></div>
        <div class="shimmer h-4 w-10/12 rounded"></div>
        <div class="shimmer h-4 w-8/12 rounded"></div>
        <p class="pt-1 text-xs text-slate-500">Analyzing your text…</p>
      </div>

      <div id="error" class="hidden rounded-xl border border-red-400/30 bg-red-500/10 p-4 text-sm text-red-200"></div>

      <div id="output" class="fade-up hidden max-h-[34rem] overflow-y-auto whitespace-pre-wrap break-words rounded-2xl border border-white/10 bg-black/25 p-5 text-[15px] leading-relaxed text-slate-100"></div>
    </section>

    <footer class="mt-12 text-center text-xs text-slate-600">AI Grammar Checker v2.0</footer>
  </main>

  <script>
    // ====== CONFIG ======
    const WEBHOOK_URL = 'https://sohan74.app.n8n.cloud/webhook/grammar-checker';
    const TIMEOUT_MS = 90000;

    const $ = (id) => document.getElementById(id);
    const form = $('form'), textEl = $('text'), toneEl = $('tone'), submitBtn = $('submit');
    const spinner = $('spinner'), sparkle = $('sparkle'), btnLabel = $('btnLabel'), counter = $('counter');
    const result = $('result'), skeleton = $('skeleton'), errorEl = $('error'), output = $('output');
    const copyBtn = $('copy'), copyLabel = $('copyLabel');
    let lastText = '';

    function updateCounter() {
      const v = textEl.value;
      const words = v.trim() ? v.trim().split(/\s+/).length : 0;
      counter.textContent = `${v.length.toLocaleString()} characters · ${words.toLocaleString()} words`;
    }
    textEl.addEventListener('input', updateCounter);
    textEl.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); form.requestSubmit(); }
    });

    function setLoading(on) {
      submitBtn.disabled = on;
      spinner.classList.toggle('hidden', !on);
      sparkle.classList.toggle('hidden', on);
      btnLabel.textContent = on ? 'Checking…' : 'Check Grammar';
      textEl.readOnly = on;
      toneEl.disabled = on;
    }

    function show(state) {
      result.classList.remove('hidden');
      skeleton.classList.toggle('hidden', state !== 'loading');
      errorEl.classList.toggle('hidden', state !== 'error');
      output.classList.toggle('hidden', state !== 'output');
      copyBtn.classList.toggle('hidden', state !== 'output');
      copyBtn.classList.toggle('inline-flex', state === 'output');
    }

    // Safe formatting: escape HTML first, then apply a small markdown subset.
    function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function format(s) {
      return escapeHtml(s)
        .replace(/^#{1,3}\s+(.+)$/gm, '<span class="mt-3 mb-1 block text-base font-semibold text-white">$1</span>')
        .replace(/\*\*(.+?)\*\*/g, '<strong class="font-semibold text-white">$1</strong>')
        .replace(/`([^`]+)`/g, '<code class="rounded bg-white/10 px-1.5 py-0.5 text-[13px] text-violet-200">$1</code>')
        .replace(/^\s*[-*]\s+/gm, '<span class="text-violet-300">•</span> ');
    }

    // Accept plain text (expected) but gracefully unwrap JSON if n8n returns it.
    function toPlainText(raw) {
      const t = raw.trim();
      if (/^[\[{]/.test(t)) {
        try {
          const pick = (d) => {
            if (d == null) return '';
            if (typeof d === 'string') return d;
            if (Array.isArray(d)) return d.map(pick).filter(Boolean).join('\n\n');
            for (const k of ['output', 'text', 'response', 'result', 'message', 'data', 'content'])
              if (d[k] != null) return pick(d[k]);
            return JSON.stringify(d, null, 2);
          };
          return pick(JSON.parse(t));
        } catch { /* fall through to raw text */ }
      }
      return raw;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = textEl.value.trim();
      if (!text) return;

      setLoading(true);
      show('loading');
      result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);

      try {
        // FormData: the browser sets the multipart Content-Type (with boundary) automatically.
        const fd = new FormData();
        fd.append('text', text);
        fd.append('tone', toneEl.value);

        const res = await fetch(WEBHOOK_URL, { method: 'POST', body: fd, signal: ctrl.signal });
        const raw = await res.text();
        if (!res.ok) throw new Error(`Server responded with ${res.status} ${res.statusText}. ${raw.slice(0, 200)}`);

        const out = toPlainText(raw).trim();
        if (!out) throw new Error('The workflow returned an empty response.');

        lastText = out;
        output.innerHTML = format(out);
        show('output');
        output.classList.remove('fade-up'); void output.offsetWidth; output.classList.add('fade-up');
      } catch (err) {
        let msg = err.name === 'AbortError' ? 'The request timed out. Please try again.' : err.message;
        if (err instanceof TypeError) {
          msg = 'Could not reach the n8n webhook. Make sure the workflow is active (published) and that ' +
                'Allowed Origins (CORS) is set to * in the Webhook node options.';
        }
        errorEl.textContent = msg;
        show('error');
      } finally {
        clearTimeout(timer);
        setLoading(false);
      }
    });

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(lastText);
        copyLabel.textContent = 'Copied!';
      } catch {
        const ta = document.createElement('textarea');
        ta.value = lastText; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); copyLabel.textContent = 'Copied!'; }
        catch { copyLabel.textContent = 'Copy failed'; }
        ta.remove();
      }
      setTimeout(() => (copyLabel.textContent = 'Copy Text'), 1600);
    });
  </script>
</body>
</html>
